// waddle-protocol v0 — services.proto
//
// The control plane: typed, versioned gRPC for session lifecycle, grant
// negotiation, intervention claims, and reset requests. Nothing
// high-bandwidth ever touches these RPCs (pixels ride the media plane), with
// exactly one bounded exception: FrameStill stills on StreamObservations,
// rate-capped by the declared StreamPolicy.still_fps (flag
// waddle.v0.obs.stills) — never video. Nothing stateful ever touches the
// media plane.
//
// Service shape decisions (normative rationale in docs/FSM.md):
//   - ClaimEpisode / HandoffLease are UNARY: atomic decisions with an
//     immediate grant/deny, mirroring the production broker's lease protocol.
//   - GateActions is the ONE ordered event stream per session. SDK → plane:
//     EpisodeEvents, VerbResults, gate status, and flagged UI chat requests.
//     Plane → SDK: claim directives,
//     intervention action chunks, verb requests, grant changes, episode
//     directives, flagged hosted-run requests, and flagged UI chat events.
//     Conformance scenarios assert emissions on exactly this stream.
//   - Heartbeat is bidi so grant demotions have a low-latency down-path
//     independent of gate traffic.
//   - RequestReset is server-streaming: resets are long-running, with phase
//     progress ending in a verification record.
//
// Authentication is transport metadata (bearer tokens), not protocol surface.

syntax = "proto3";

package waddle.v0;

import "waddle/v0/control.proto";
import "waddle/v0/descriptors.proto";
import "waddle/v0/episode.proto";

// ---------------------------------------------------------------------------
// Register & negotiate
// ---------------------------------------------------------------------------

message ClientInfo {
  string implementation = 1;  // e.g. "waddle-core"
  string version = 2;
  string platform = 3;  // e.g. "linux/x86_64"
}

message RegisterRequest {
  string project = 1;
  ClientInfo client = 2;
  RobotDescription robot = 3;
  // The session clock anchor, captured atomically at session start.
  ClockAnchor clock_anchor = 4;
  // Feature flags this client speaks (see docs/VERSIONING.md). Negotiation
  // is per-connection: old SDKs never see undeclared features planned
  // against them.
  repeated string feature_flags = 5;
  string session_nonce = 6;
  // Exact hosted connector binding (flag waddle.v0.connector.binding).
  // project remains field 1 for backwards compatibility and carries the
  // binding's project_id whenever these fields are present.
  string customer_id = 7;
  string workspace_id = 8;
  // A short-lived authorization probe. The plane authenticates the exact
  // binding but MUST NOT expose the connection as a runnable SDK session.
  bool authorization_only = 9;
}

message RegisterResponse {
  string session_id = 1;
  int64 t_server_unix_ns = 2;
  repeated string accepted_feature_flags = 3;
  string detail = 4;
}

// Windows in which a verb may actually be invoked for measurement (N11).
// You cannot continuously measure the latency of a verb you dare not call:
// hold() on a robot mid-task is an incident, not a probe. Verbs are
// re-measured only in safe windows; the heartbeat carries proxy signals.
enum MeasurementWindow {
  MEASUREMENT_WINDOW_UNSPECIFIED = 0;
  MEASUREMENT_WINDOW_DOCTOR = 1;           // an explicit doctor run
  MEASUREMENT_WINDOW_BETWEEN_EPISODES = 2;
  MEASUREMENT_WINDOW_DURING_RESET = 3;
  // Not a verb invocation: health inferred from proxy signals.
  MEASUREMENT_WINDOW_LIVE_PROXY = 4;
}

// A declared grant plus its live status — the live lattice (N6). Doctor-time
// measurements seed it; heartbeat proxy signals maintain it.
message GrantState {
  Grant grant = 1;
  GrantStatus status = 2;
  optional int64 measured_latency_ns = 3;
  int64 t_measured_ns = 4;
  MeasurementWindow window = 5;
}

// Re-invocable mid-session: grants are live, not static.
message NegotiateRequest {
  string session_id = 1;
  repeated Grant declared_grants = 2;
  // Where the single-writer lease is enforced for this integration (N7).
  LeaseEnforcement lease_enforcement = 3;
  HandoffPolicy handoff = 4;
  RecordingModeDeclaration recording = 5;
  // Codecs loaded into the write path, with attestation (N15).
  repeated CodecDescriptor codecs = 6;
  repeated string feature_flags = 7;
}

// Declared separately from sidecar.proto's RecordingMode enum home so the
// negotiation can also carry the audit quota opt-in (N13).
message RecordingModeDeclaration {
  // Numeric values mirror sidecar.proto's RecordingMode.
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_LOCAL = 1;
    MODE_REFERENCE = 2;
    MODE_SIDECAR_ONLY = 3;
  }
  Mode mode = 1;
  // N13: the random retention quota for the audit slice, in basis points
  // (e.g. 500 = 5% of episodes retained at random, independent of events).
  // 0 = declined; judge metrics for the project are then permanently marked
  // unaudited in every Corpus surface.
  uint32 audit_quota_bp = 2;
}

message NegotiateResponse {
  repeated GrantState grants = 1;
  repeated string accepted_feature_flags = 2;
  LeaseEnforcement recorded_enforcement = 3;
  bool codecs_accepted = 4;
  string detail = 5;
}

// ---------------------------------------------------------------------------
// Observations (control-plane summaries; pixels ride the media plane, with
// one bounded exception: FrameStill, flag waddle.v0.obs.stills)
// ---------------------------------------------------------------------------

message ProprioSample {
  repeated double joint_pos = 1;
  repeated double joint_vel = 2;
  optional Pose ee_pose = 3;
  optional double gripper = 4;
  string part = 5;  // "" = the sole/default part
}

message TimeSeriesSample {
  string name = 1;
  repeated double values = 2;
}

// Aligns control-plane time to media streams without moving pixels: which
// frame of which camera existed at t_ns.
message FrameNotice {
  string camera = 1;
  uint64 frame_seq = 2;
  string stream_id = 3;
}

// A single encoded still for agent perception (flag waddle.v0.obs.stills).
// Shares FrameNotice's per-camera sequence numbering; the rate is bounded by
// the camera's declared StreamPolicy.still_fps. This is NOT a video path —
// LiveKit media remains the only video transport.
message FrameStill {
  string camera = 1;
  uint64 frame_seq = 2;
  CameraEncoding encoding = 3;
  uint32 width = 4;
  uint32 height = 5;
  bytes data = 6;
}

message ObservationUpdate {
  int64 t_ns = 1;
  oneof payload {
    ProprioSample proprio = 2;
    TimeSeriesSample series = 3;
    FrameNotice frame = 4;
    FrameStill still = 5;  // flag waddle.v0.obs.stills
  }
}

message ObservationAck {
  int64 t_server_unix_ns = 1;
}

// ---------------------------------------------------------------------------
// GateActions — the one ordered event stream
// ---------------------------------------------------------------------------

message GateStatus {
  GateMode mode = 1;
  string active_claim_id = 2;
  double tick_rate_hz = 3;
}

message GateClientMessage {
  oneof msg {
    EpisodeEvent event = 1;
    VerbResult verb_result = 2;
    GateStatus status = 3;
    // Flag waddle.v0.plane.acks: the SDK's accept/reject answer to a plane
    // directive that carried a directive_id (see DirectiveAck).
    DirectiveAck ack = 4;
    // Flag waddle.v0.agent.chat: one bounded, explicitly correlated user
    // message for the session's active invited host. Connection-scoped:
    // never buffered offline or replayed after re-registration.
    ChatRequest chat_request = 5;
    // Flag waddle.v0.task.sessions: a named, durable hosted-task operation.
    // Connection-scoped delivery; durability begins only after the plane
    // acknowledges it with a TaskSessionEvent.
    TaskSessionRequest task_session_request = 6;
    // Flag waddle.v0.calibration.measurements: one locally resolved 3-D
    // calibration observation. Pixels and depth never ride GateActions.
    CalibrationMeasurement calibration_measurement = 7;
    // Flag waddle.v0.workspace.artifacts: request a reviewed workspace
    // delivery. The archive itself never rides GateActions.
    WorkspaceArtifactRequest workspace_artifact_request = 8;
    // Flag waddle.v0.hosted.runs: the SDK's connection-scoped admission
    // answer to a HostedRunRequest. Never buffered or replayed.
    HostedRunStatus hosted_run_status = 9;
  }
}

// ---------------------------------------------------------------------------
// Plane-started episodes (flag waddle.v0.hosted.runs)
// ---------------------------------------------------------------------------

// Ask an idle SDK session to open one ordinary core-owned episode. The
// request belongs to the connection that delivered it and is never replayed
// automatically. request_id is an opaque idempotency key bounded to 128 UTF-8
// bytes. task_metadata has the same bounds as AgentInviteEvent.task_metadata:
// at most 64 non-empty keys, 128 bytes/key, 4096 bytes/value, and 16 KiB total.
// timeout_ns is a positive relative lifetime for the accepted episode; expiry
// requests HOLD and terminates it with ABORT through the ordinary FSM path.
//
// Duplicate request_ids within one SDK session return the first status
// verbatim, even when their other fields differ. A duplicate never opens a
// second episode. After reconnect a plane may retry explicitly to learn that
// original result, but the transport never retries a request on its behalf.
message HostedRunRequest {
  string request_id = 1;
  map<string, string> task_metadata = 2;
  int64 timeout_ns = 3;
}

enum HostedRunStatusKind {
  HOSTED_RUN_STATUS_KIND_UNSPECIFIED = 0;
  HOSTED_RUN_STATUS_KIND_ACCEPTED = 1;
  HOSTED_RUN_STATUS_KIND_REJECTED = 2;
  HOSTED_RUN_STATUS_KIND_BUSY = 3;
}

// Machine-readable admission detail. code is a stable snake_case reason;
// message is bounded public-safe prose; context contains bounded identifiers,
// never secrets, traces, or transport credentials.
message HostedRunDetail {
  string code = 1;
  string message = 2;
  map<string, string> context = 3;
}

// One terminal admission answer, not episode lifecycle. ACCEPTED carries the
// newly opened episode_id; BUSY carries the currently active episode_id when
// one exists; REJECTED may omit it. Subsequent claim, action, completion,
// recording, fault, and timeline traffic uses the existing waddle.v0 messages.
// This message is connection-scoped and is never buffered or replayed.
message HostedRunStatus {
  string request_id = 1;
  HostedRunStatusKind kind = 2;
  string episode_id = 3;
  HostedRunDetail detail = 4;
}
// Flag waddle.v0.agent.chat. Text is UTF-8 and bounded by the receiving
// implementation to 4 KiB; request_id is an opaque caller correlation id
// bounded to 128 UTF-8 bytes. A receiver MUST reject larger values rather
// than truncate them.
message ChatRequest {
  string request_id = 1;
  string text = 2;
}

enum ChatEventKind {
  CHAT_EVENT_KIND_UNSPECIFIED = 0;
  CHAT_EVENT_KIND_ACCEPTED = 1;
  CHAT_EVENT_KIND_TEXT = 2;
  CHAT_EVENT_KIND_DONE = 3;
  CHAT_EVENT_KIND_UNAVAILABLE = 4;
  CHAT_EVENT_KIND_ERROR = 5;
}

// Flag waddle.v0.agent.chat. Events for one request are ordered by sequence.
// `text` is main-conversation assistant text only. `detail` is a bounded,
// public-safe lifecycle explanation; neither field may contain thinking,
// prompts, tool names/payloads, delegated output, or internal errors.
message ChatEvent {
  string request_id = 1;
  uint64 sequence = 2;
  ChatEventKind kind = 3;
  string text = 4;
  string detail = 5;
}

// ---------------------------------------------------------------------------
// Named hosted-task sessions (flag waddle.v0.task.sessions)
// ---------------------------------------------------------------------------

enum TaskSessionRequestKind {
  TASK_SESSION_REQUEST_KIND_UNSPECIFIED = 0;
  TASK_SESSION_REQUEST_KIND_CREATE = 1;
  TASK_SESSION_REQUEST_KIND_MESSAGE = 2;
  TASK_SESSION_REQUEST_KIND_INTERJECT = 3;
  TASK_SESSION_REQUEST_KIND_INTERRUPT = 4;
  TASK_SESSION_REQUEST_KIND_HISTORY = 5;
}

// A named durable conversation with the hosted task mechanism. request_id
// is bounded to 128 UTF-8 bytes, task_session_id and name to 200 bytes,
// and text to 4 KiB. CREATE carries a name and initial text; subsequent
// mutations carry the plane-issued task_session_id. HISTORY carries that id
// and after_sequence only, and returns at most one plane-bounded page followed
// by HISTORY_COMPLETE. Receivers reject, never truncate, an over-bound value.
// Requests are connection-scoped and are not
// replayed after reconnect: retry uses a fresh request_id against the durable
// task_session_id, and the plane de-duplicates it transactionally.
message TaskSessionRequest {
  string request_id = 1;
  string task_session_id = 2;
  string name = 3;
  TaskSessionRequestKind kind = 4;
  string text = 5;
  // HISTORY returns the durable suffix strictly after this session-global
  // sequence. The plane bounds each reply page; clients advance this cursor.
  uint64 after_sequence = 6;
}

enum TaskSessionEventKind {
  TASK_SESSION_EVENT_KIND_UNSPECIFIED = 0;
  TASK_SESSION_EVENT_KIND_ACCEPTED = 1;
  TASK_SESSION_EVENT_KIND_TEXT = 2;
  TASK_SESSION_EVENT_KIND_DONE = 3;
  TASK_SESSION_EVENT_KIND_INTERRUPTED = 4;
  TASK_SESSION_EVENT_KIND_UNAVAILABLE = 5;
  TASK_SESSION_EVENT_KIND_ERROR = 6;
  TASK_SESSION_EVENT_KIND_HISTORY_COMPLETE = 7;
}

// Ordered public-safe output and lifecycle for one named task session.
// text is main-conversation user/assistant output only; role is "user" or
// "assistant" when text is present and empty otherwise. detail is plane-authored
// lifecycle text. Thinking, prompts, skills markdown, tool/delegated payloads,
// traces, internal errors, and provider metadata are forbidden in both.
message TaskSessionEvent {
  string request_id = 1;
  string task_session_id = 2;
  string name = 3;
  uint64 sequence = 4;
  TaskSessionEventKind kind = 5;
  string text = 6;
  string detail = 7;
  string role = 8;
  // Set only on HISTORY_COMPLETE. This is the last durable session sequence
  // represented by the page and is the cursor for the next HISTORY request.
  uint64 history_cursor = 9;
}

// ---------------------------------------------------------------------------
// Calibration measurements (flag waddle.v0.calibration.measurements)
// ---------------------------------------------------------------------------

// One RGB-D click resolved by the customer process against the depth sample
// captured with that RGB frame. Only this bounded 3-D result crosses the
// control plane. point is expressed in frame_id; the virtual cell owns pose
// validation, collection, solving, and catalog updates. Motion continues to
// use ordinary ActionChunk intake and is refused whole, never clamped.
message CalibrationMeasurement {
  string calibration_id = 1;
  string sample_id = 2;
  string camera = 3;
  uint64 frame_seq = 4;
  int64 t_ns = 5;
  string frame_id = 6;
  Vec3 point = 7;
  optional double depth_m = 8;
}

// Hosted Calibrate UI request for the customer SDK to resolve one pixel
// against the exact retained RGB-D frame. The response is the existing
// CalibrationMeasurement with the same calibration_id and sample_id. This
// message is connection-scoped and is never buffered or replayed.
message CalibrationMeasurementRequest {
  string calibration_id = 1;
  string sample_id = 2;
  string camera = 3;
  uint64 frame_seq = 4;
  uint32 x = 5;
  uint32 y = 6;
}

enum CalibrationUpdateKind {
  CALIBRATION_UPDATE_KIND_UNSPECIFIED = 0;
  CALIBRATION_UPDATE_KIND_ACCEPTED = 1;
  CALIBRATION_UPDATE_KIND_NEEDS_SAMPLE = 2;
  CALIBRATION_UPDATE_KIND_SOLVED = 3;
  CALIBRATION_UPDATE_KIND_REFUSED = 4;
}

// Bounded lifecycle only. A NEEDS_SAMPLE update identifies the camera and
// frame in which the site operator should click; it carries no pixels. SOLVED
// identifies a customer-scoped catalog entry, optionally sourced explicitly
// from another project owned by the same authenticated customer.
message CalibrationUpdate {
  string calibration_id = 1;
  CalibrationUpdateKind kind = 2;
  string camera = 3;
  uint64 frame_seq = 4;
  string catalog_name = 5;
  string source_project = 6;
  string detail = 7;
  uint64 sequence = 8;          // strictly increasing within calibration_id
}

// ---------------------------------------------------------------------------
// Reviewed workspace artifacts (flag waddle.v0.workspace.artifacts)
// ---------------------------------------------------------------------------

// Asks the plane to export the allowlisted workspace program. Calibration
// names select catalog entries explicitly; prompts, skills markdown, MCP
// definitions, traces, secrets, and authoring metadata are never implied.
message WorkspaceArtifactRequest {
  string request_id = 1;
  repeated string graph_ids = 2;
  repeated string calibration_names = 3;
}

// Bounded metadata plus an opaque one-time reference for a separate
// authenticated artifact endpoint. No archive bytes ride GateActions.
message WorkspaceArtifactReady {
  string request_id = 1;
  string artifact_id = 2;
  string sha256 = 3;
  uint64 size_bytes = 4;
  string download_ref = 5;
  int64 expires_unix_ns = 6;
  string detail = 7;
}

enum ClaimDirectiveKind {
  CLAIM_DIRECTIVE_KIND_UNSPECIFIED = 0;
  CLAIM_DIRECTIVE_KIND_GRANT = 1;
  CLAIM_DIRECTIVE_KIND_RELEASE = 2;
  CLAIM_DIRECTIVE_KIND_RETAKE = 3;
}

message ClaimDirective {
  ClaimDirectiveKind kind = 1;
  Claim claim = 2;
  // Flag waddle.v0.plane.acks: correlation id for a DirectiveAck. The SDK
  // emits an ack only when this is set AND the flag was negotiated;
  // fire-and-forget remains valid for planes that don't set ids.
  optional string directive_id = 3;
}

enum EpisodeDirectiveKind {
  EPISODE_DIRECTIVE_KIND_UNSPECIFIED = 0;
  EPISODE_DIRECTIVE_KIND_TERMINATE = 1;
  // The supervisor judged the episode done; ep.done flips.
  EPISODE_DIRECTIVE_KIND_MARK_DONE = 2;
}

message EpisodeDirective {
  EpisodeDirectiveKind kind = 1;
  string episode_id = 2;
  TerminalOutcome outcome = 3;
  string reason = 4;
  // Flag waddle.v0.plane.acks: correlation id for a DirectiveAck. The SDK
  // emits an ack only when this is set AND the flag was negotiated;
  // fire-and-forget remains valid for planes that don't set ids.
  optional string directive_id = 5;
}

// Flag waddle.v0.plane.acks — the SDK's answer to one plane directive
// (GateClientMessage arm 4). accepted=true means the session FSM applied the
// directive's event(s); accepted=false carries the FSM's rejection reason
// (guard-row language, e.g. "engage outside RUNNING (E7)") — the directive
// changed nothing. Emitted only when the directive carried a directive_id
// AND the flag was negotiated on this connection; a directive without an id
// stays fire-and-forget. A directive too malformed to decode into session
// events at all (e.g. a ClaimDirective with no claim) produces no ack.
message DirectiveAck {
  string directive_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message GateServerMessage {
  oneof msg {
    ClaimDirective claim = 1;
    // Intervention actions from plane-side sources (teleop consoles reach the
    // robot via the media plane's data channel; agent chunks may ride here).
    ActionChunk intervention_chunk = 2;
    VerbRequest verb = 3;
    GrantStatusChange grant_change = 4;
    EpisodeDirective episode = 5;
    ResetWindowDirective reset_window = 6; // flag waddle.v0.reset.remote
    AgentTaskUpdate agent_update = 7;      // flag waddle.v0.agent
    ChatEvent chat_event = 8;              // flag waddle.v0.agent.chat
    TaskSessionEvent task_session_event = 9; // flag waddle.v0.task.sessions
    CalibrationUpdate calibration_update = 10; // flag waddle.v0.calibration.measurements
    WorkspaceArtifactReady workspace_artifact_ready = 11; // flag waddle.v0.workspace.artifacts
    HostedRunRequest hosted_run_request = 12; // flag waddle.v0.hosted.runs
    CalibrationMeasurementRequest calibration_measurement_request = 13; // flag waddle.v0.calibration.measurements
  }
}

// ---------------------------------------------------------------------------
// Remote reset windows (flag waddle.v0.reset.remote)
// ---------------------------------------------------------------------------
//
// Window-open needs no new client arm: ResetWindowEvent{OPENED} is an
// EpisodeEvent and the reducer already forwards every emission to the plane.
// ResetRequest/ResetProgress (the RequestReset RPC) are untouched — they
// model plane-executed resets; the window below is SDK-executed under plane
// direction. Remote actor action streams reuse existing transports: teleop
// via media intake, agent chunks via GateServerMessage.intervention_chunk.

enum ResetWindowDirectiveKind {
  RESET_WINDOW_DIRECTIVE_KIND_UNSPECIFIED = 0;
  RESET_WINDOW_DIRECTIVE_KIND_ENGAGE = 1;    // this actor performs the reset
  RESET_WINDOW_DIRECTIVE_KIND_COMPLETE = 2;  // reset done; result attached
  RESET_WINDOW_DIRECTIVE_KIND_CANCEL = 3;    // plane withdraws the actor
}

message ResetWindowDirective {
  ResetWindowDirectiveKind kind = 1;
  ResetKind reset = 2;
  Claim claim = 3;                  // ENGAGE: who resets (a real Claim; C6 applies)
  optional ResetResult result = 4;  // COMPLETE: ok + optional inline verification
  // Flag waddle.v0.plane.acks: correlation id for a DirectiveAck. The SDK
  // emits an ack only when this is set AND the flag was negotiated;
  // fire-and-forget remains valid for planes that don't set ids.
  optional string directive_id = 5;
}

// ---------------------------------------------------------------------------
// Agent task updates (flag waddle.v0.agent)
// ---------------------------------------------------------------------------
//
// Status of an agent-invited episode, plane → SDK. The invite itself is an
// EpisodeEvent (agent_invite, episode.proto) and reaches the plane through
// the existing uplink; the invited agent claims, engages, streams chunks,
// and finishes through the EXISTING intervention machinery (ClaimDirective,
// intervention_chunk, EpisodeDirective). This message adds status only,
// never authority.

enum AgentTaskUpdateKind {
  AGENT_TASK_UPDATE_KIND_UNSPECIFIED = 0;
  // The invite was advertised to the agent fleet.
  AGENT_TASK_UPDATE_KIND_QUEUED = 1;
  // The task will never run (reason in detail). Legal only before an agent
  // engages; a DENIED after ENGAGE is rejected (docs/FSM.md row E26b).
  AGENT_TASK_UPDATE_KIND_DENIED = 2;
  // Informational: the task finished; recording_ref carries an opaque
  // Waddle-side recording reference.
  AGENT_TASK_UPDATE_KIND_COMPLETED = 3;
}

message AgentTaskUpdate {
  string episode_id = 1;
  AgentTaskUpdateKind kind = 2;
  string detail = 3;
  // Opaque Waddle-side recording reference; set on COMPLETED.
  string recording_ref = 4;
  // Flag waddle.v0.plane.acks: present only when acks are in use and this
  // update answers a specific request.
  optional string directive_id = 5;
}

// ---------------------------------------------------------------------------
// Claims, leases, resets
// ---------------------------------------------------------------------------

message ClaimEpisodeRequest {
  string session_id = 1;
  string episode_id = 2;
  ActorRef actor = 3;
  string source_name = 4;
  bool self_initiated = 5;
  repeated SpaceKind spaces = 6;
}

message ClaimEpisodeResponse {
  bool granted = 1;
  Claim claim = 2;
  string detail = 3;
}

message HandoffLeaseRequest {
  string session_id = 1;
  LeaseHandoff handoff = 2;
}

message HandoffLeaseResponse {
  LeaseResponse response = 1;
}

enum ResetPhase {
  RESET_PHASE_UNSPECIFIED = 0;
  RESET_PHASE_PLANNING = 1;
  RESET_PHASE_EXECUTING = 2;
  RESET_PHASE_VERIFYING = 3;
  RESET_PHASE_DONE = 4;
}

message ResetProgress {
  ResetPhase phase = 1;
  string strategy = 2;
  string detail = 3;
  // Set on the final (DONE) message.
  optional ResetResult result = 4;
}

// ---------------------------------------------------------------------------
// Heartbeat (N11)
// ---------------------------------------------------------------------------

message JitterStats {
  int64 p50_ns = 1;
  int64 p95_ns = 2;
  int64 p99_ns = 3;
  int64 max_ns = 4;
  double rate_hz = 5;
  uint32 samples = 6;
}

// Safely-measurable proxy signals for grant health (N11) — NEVER live verb
// latencies. Gate-tick jitter is a direct read on interpreter/executor health
// for advisory integrations; callback dispatch time covers the integrator's
// registered verbs as invoked in safe contexts.
message ProxySignals {
  int64 control_rtt_ns = 1;
  JitterStats gate_tick = 2;
  double host_load_1m = 3;
  double host_load_5m = 4;
  double cpu_utilization = 5;  // 0..1
  JitterStats callback_dispatch = 6;
}

// An actual verb invocation measurement, only ever taken in a safe window.
message VerbMeasurement {
  Verb verb = 1;
  SpaceKind send_interface = 2;
  int64 latency_ns = 3;
  int64 t_measured_ns = 4;
  MeasurementWindow window = 5;
}

message HeartbeatPing {
  string session_id = 1;
  int64 t_ns = 2;
  ProxySignals signals = 3;
  repeated VerbMeasurement verb_measurements = 4;
}

message HeartbeatAck {
  int64 t_server_unix_ns = 1;
  // Echo of HeartbeatPing.t_ns — gives the client its control-plane RTT
  // sample without a second clock.
  int64 echo_t_ns = 2;
  // Demotions/re-promotions ride here as well as on GateActions, so they
  // survive a stalled gate stream.
  repeated GrantStatusChange grant_changes = 3;
}

// ---------------------------------------------------------------------------
// The service
// ---------------------------------------------------------------------------

service ControlPlane {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse);
  rpc StreamObservations(stream ObservationUpdate) returns (stream ObservationAck);
  rpc GateActions(stream GateClientMessage) returns (stream GateServerMessage);
  rpc ClaimEpisode(ClaimEpisodeRequest) returns (ClaimEpisodeResponse);
  rpc HandoffLease(HandoffLeaseRequest) returns (HandoffLeaseResponse);
  rpc RequestReset(ResetRequest) returns (stream ResetProgress);
  rpc Heartbeat(stream HeartbeatPing) returns (stream HeartbeatAck);
}
