[package]
name = "waddle-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Waddle composition root: the Session object wiring FSM, gate, ingest, tripwires, sidecar, media, and control plane onto core-owned threads"

[features]
# Deferred integrations re-exported from the leaf crates.
grpc = ["waddle-controlplane/tonic-transport"]
livekit = ["waddle-media/livekit"]

[dependencies]
bytes = { workspace = true }
waddle-types = { workspace = true }
waddle-fsm = { workspace = true }
waddle-gate = { workspace = true }
waddle-tripwire = { workspace = true }
waddle-ingest = { workspace = true }
waddle-media = { workspace = true }
waddle-controlplane = { workspace = true }
waddle-sidecar = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
rtrb = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mcap = { workspace = true }

[lints]
workspace = true
