# Release — build the two waddle-sdk wheels and publish them to PyPI.
#
# WHAT SHIPS (CLAUDE.md, "Two distributions from one source tree"):
#
#   waddle-sdk         sdk/pyproject.toml         module waddle_sdk._core
#                      features: pyo3/extension-module + grpc      <- default install
#   waddle-sdk-media   sdk/media/pyproject.toml   module waddle_media._core
#                      the SAME rust/Cargo.toml + livekit           <- pip install 'waddle-sdk[media]'
#
# Each is one build of one manifest (sdk/rust/Cargo.toml), so the two can
# never disagree on a version; `waddle_sdk._native` refuses a mismatched pair at
# import, and `sdk/tests/test_features.py` holds the `media` extra's exact
# pin to that version. Bumping a version means editing BOTH
# sdk/rust/Cargo.toml and the pin in sdk/pyproject.toml — see docs/RELEASING.md.
#
# WHEELS ONLY — there is deliberately NO sdist, for either project. Both
# `[tool.maturin] manifest-path`s point at sdk/rust/Cargo.toml, whose
# dependencies are path deps into ../../waddle-core/crates/* : they escape
# both pyproject directories, so any sdist maturin could produce would be an
# archive that cannot build. (`sdk/rust` is its own cargo workspace on
# purpose; see CLAUDE.md.) One abi3 wheel per platform covers every supported
# interpreter instead — pyo3 is built `abi3-py310`, so a cp310-abi3 wheel
# installs on 3.10+. Free-threaded builds (3.13t/3.14t) are NOT abi3 and are
# not built here; add a separate `-i python3.Xt` matrix leg if they are ever
# wanted.
#
# CREDENTIALS: none. Publishing is PyPI Trusted Publishing (OIDC) — the
# publish jobs hold `id-token: write` and a GitHub environment, and there is
# no token or secret anywhere in this file. The exact publisher identities,
# including the one-time setup for the new media project, are in docs/RELEASING.md.
#
# WHY TWO PUBLISH JOBS, AND TWO ENVIRONMENTS: PyPI keys a trusted
# publisher on the (owner, repository, workflow, environment) tuple and
# refuses to register the same tuple for a second project name. The two
# projects therefore cannot share an environment — `waddle-sdk` publishes
# from `pypi`, `waddle-sdk-media` from `pypi-media` — and since a job has
# exactly one environment, that is one publish job each. Artifact names are
# prefixed per distribution (`sdk-wheels-*` / `media-wheels-*`) so each job
# downloads only what it is allowed to upload. Both jobs nevertheless depend
# on both complete builds, making the exact-pinned pair atomic.

name: release

on:
  push:
    tags:
      - "v*"
  # The manual escape hatch: re-run a release whose publish step failed, or
  # cut one from a branch. It publishes exactly what it builds, so a dispatch
  # over an already-published version fails loudly on PyPI (no
  # `skip-existing`) rather than half-shipping.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run the same complete gate as every main push and pull request before
  # spending matrix capacity or minting either publishing identity.
  quality:
    name: release gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------
  # The default distribution: waddle-sdk (control transport, no LiveKit).
  # ---------------------------------------------------------------------
  wheels:
    name: waddle-sdk (${{ matrix.platform.name }})
    needs: [quality]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # `publish-sdk` needs this whole job, so a failing leg already blocks
      # the default publish. Let the other legs finish so one broken platform
      # is diagnosed in one run instead of five.
      fail-fast: false
      matrix:
        platform:
          # Linux builds happen inside the manylinux container maturin-action
          # selects from `manylinux: auto` (the whole GITHUB_WORKSPACE is
          # mounted, which is what lets the path deps into ../waddle-core
          # resolve). auditwheel runs there and stamps the compatible tag.
          # Both legs are NATIVE — aarch64 on an arm runner rather than a
          # cross container — so each one can import the wheel it just built.
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6

      # 3.10 is the floor (`requires-python = ">=3.10"`) and the abi3 floor.
      # On the host builds (macOS/Windows) it is also the interpreter maturin
      # links the abi3 wheel against; on Linux the build interpreter comes
      # from inside the container, and this one only runs the smoke below.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          # `working-directory` is where maturin reads pyproject.toml, which
          # is how the two distributions are selected — the default wheel is
          # sdk/, the companion is sdk/media/. The Rust manifest comes from
          # that file's `[tool.maturin] manifest-path`, so no -m flag here.
          working-directory: sdk
          target: ${{ matrix.platform.target }}
          # Ignored off Linux; on Linux it picks the container + the tag.
          manylinux: auto
          args: --release --out dist
          # The toolchain is pinned by sdk/rust-toolchain.toml (rustup honors
          # it in the container too, since the workdir is under it) — do not
          # restate the version here, it would be a second place to bump.
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Prove the artifact we are about to publish imports and is the build we
      # think it is: the DEFAULT wheel carries the gRPC control transport and
      # nothing else (LiveKit lives in the companion). `waddle_sdk._native.FEATURES`
      # is the only feature detection this SDK permits.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install sdk/dist/*.whl
          # Run from the repo root, never from sdk/: the source tree there
          # would shadow the installed package.
          python -c "import waddle_sdk, waddle_sdk._native as n; f=sorted(n.FEATURES); print('waddle', waddle_sdk.__version__, f); assert f == ['grpc'], f"

      # `sdk-wheels-*` — the prefix `publish-sdk` globs for. Nothing the media
      # job uploads may ever match it.
      - uses: actions/upload-artifact@v6
        with:
          name: sdk-wheels-${{ matrix.platform.name }}
          path: sdk/dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The companion distribution: waddle-sdk-media (adds the LiveKit media
  # plane). Build it natively on every platform supported by the base SDK.
  #
  # webrtc-sys' build script downloads a prebuilt libwebrtc (~690 MB
  # extracted) for each target. Linux downloads inside the manylinux
  # container and the resulting extension must pass auditwheel; macOS and
  # Windows link their matching upstream archives natively. Any rejection or
  # import failure fails this matrix and publishes neither distribution. Do
  # NOT add `continue-on-error`: a green job that uploaded no companion wheel
  # would be a release claiming an extra it did not ship.
  #
  # Both publish jobs wait on this matrix and the complete default matrix.
  # A failure therefore publishes neither distribution: the default wheel's
  # exact `[media]` pin can never advertise a companion version that this
  # release did not build successfully.
  #
  # manylinux_2_28 rather than the default wheel's `auto` (2014): libwebrtc's
  # prebuilt binaries want a modern C++ toolchain, and the 2_28 image has
  # one. The cost is a higher glibc floor for the media extra only
  # (glibc >= 2.28: Debian 10, Ubuntu 18.10+, RHEL 8+). If the C++ side still
  # comes up short, `before-script-linux` is where to install what it needs.
  # ---------------------------------------------------------------------
  media-wheels:
    name: waddle-sdk-media (${{ matrix.platform.name }})
    needs: [quality]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # webrtc-sys links ScreenCaptureKit, whose honest deployment floor is
      # macOS 12.3. The wheel tag must not claim compatibility below it.
      - name: Set the macOS deployment target
        if: startsWith(matrix.platform.name, 'macos-')
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.3" >> "$GITHUB_ENV"

      # LiveKit's published Windows libwebrtc archive is built with the
      # static MSVC runtime (/MT). Rust and cc otherwise select the dynamic
      # runtime (/MD), which the linker rejects as an ABI mismatch. Apply the
      # matching target feature only to this companion's Windows build; the
      # base SDK does not link libwebrtc and keeps Rust's normal default.
      - name: Match the Windows libwebrtc runtime
        if: matrix.platform.name == 'windows-x64'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sdk/media
          target: ${{ matrix.platform.target }}
          # Ignored on macOS and Windows. LiveKit's prebuilt Linux libwebrtc
          # requires the newer C++ runtime/glibc floor supplied by 2_28.
          manylinux: "2_28"
          args: --release --out dist
          # No sccache: the expensive part is a one-shot libwebrtc download
          # and link, which it cannot cache anyway.

      # The companion has no Python surface of its own, so the smoke goes
      # straight at the core: importing it is what proves the libwebrtc
      # linkage actually resolves at runtime, which is the whole risk in this
      # job. FEATURES must be the default build's strict superset.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install sdk/media/dist/*.whl
          python -c "import waddle_media._core as c; f=sorted(c.FEATURES); print('waddle_media', c.__version__, f); assert f == ['grpc', 'livekit'], f"

      # `media-wheels-*`, disjoint from the default wheel's `sdk-wheels-*`:
      # each publish job may only ever see its own distribution.
      - uses: actions/upload-artifact@v6
        with:
          name: media-wheels-${{ matrix.platform.name }}
          path: sdk/media/dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Publish, one job per distribution. They are separate because PyPI's
  # trusted publishers are unique per (owner, repo, workflow,
  # environment): the two projects cannot share the `pypi` environment, and a
  # job carries exactly one environment. Neither job checks out the repo or
  # holds any permission beyond minting its OIDC token.
  # ---------------------------------------------------------------------
  publish-sdk:
    name: publish waddle-sdk to PyPI
    needs: [wheels, media-wheels]
    runs-on: ubuntu-24.04
    # Half of the identity PyPI matches (with owner/repo/workflow); also
    # where a manual approval gate would go if this ever wants one.
    environment: pypi
    permissions:
      # Mint the OIDC token PyPI exchanges for a short-lived, project-scoped
      # upload token. Nothing else: this job never touches the repo.
      id-token: write
    steps:
      # `pattern` + `merge-multiple`: only the default wheels, straight into
      # dist/. The media artifact is not downloaded at all — this job's
      # identity is not allowed to publish it.
      - uses: actions/download-artifact@v7
        with:
          pattern: sdk-wheels-*
          merge-multiple: true
          path: dist

      # The one release trap this repo has (CLAUDE.md's release checklist):
      # the media pin in sdk/pyproject.toml is the ONE version maturin cannot
      # derive from the manifest. `sdk/tests/test_features.py` catches a
      # forgotten bump locally; this catches a tag that disagrees with what
      # was built, before any of it is on PyPI forever.
      - name: Check the wheels carry the tag's version
        run: |
          set -euo pipefail
          ls -l dist
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheels to publish"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag build; skipping the version check"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          for w in "${wheels[@]}"; do
            case "$(basename "$w")" in
              *-"$version"-*) ;;
              *) echo "::error::$(basename "$w") was not built at version $version"; exit 1 ;;
            esac
          done
          echo "all ${#wheels[@]} wheels are version $version"

      # Trusted Publishing: no `password:`, no secrets. Defaults to dist/ and
      # attaches PEP 740 attestations using the same OIDC identity.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-media:
    name: publish waddle-sdk-media to PyPI
    needs: [wheels, media-wheels]
    runs-on: ubuntu-24.04
    # A DIFFERENT environment from `publish-sdk` — see the header. It is part
    # of what PyPI matches, so renaming it here means editing the trusted
    # publisher on PyPI too.
    environment: pypi-media
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: media-wheels-*
          merge-multiple: true
          path: dist

      # Same check, same reason: the companion carries the version the
      # `[media]` extra pins, so a wheel that disagrees with the tag is
      # exactly the failure this repo's release checklist exists to prevent.
      - name: Check the wheels carry the tag's version
        run: |
          set -euo pipefail
          ls -l dist
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheels to publish"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag build; skipping the version check"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          for w in "${wheels[@]}"; do
            case "$(basename "$w")" in
              *-"$version"-*) ;;
              *) echo "::error::$(basename "$w") was not built at version $version"; exit 1 ;;
            esac
          done
          echo "all ${#wheels[@]} wheels are version $version"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
