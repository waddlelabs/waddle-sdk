name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    name: Python SDK and shim
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install LiveKit system headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: sdk/uv.lock

      - name: Build the development SDK
        working-directory: sdk
        run: uv sync --dev --locked

      - name: Test the Python SDK
        working-directory: sdk
        run: uv run --no-sync pytest

      - name: Check shim formatting
        working-directory: sdk
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint the featureless shim
        working-directory: sdk
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Lint the default gRPC shim
        working-directory: sdk
        run: cargo clippy --manifest-path rust/Cargo.toml --features grpc --all-targets -- -D warnings

      - name: Lint the gRPC and LiveKit shim
        working-directory: sdk
        run: cargo clippy --manifest-path rust/Cargo.toml --features grpc,livekit --all-targets -- -D warnings

  core:
    name: Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install LiveKit system headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev

      - name: Check core formatting
        working-directory: waddle-core
        run: cargo fmt --check

      - name: Test the featureless workspace
        working-directory: waddle-core
        run: cargo test --workspace --locked

      - name: Lint the featureless workspace
        working-directory: waddle-core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test the gRPC transport
        working-directory: waddle-core
        run: cargo test -p waddle-controlplane --features tonic-transport --locked

      - name: Test the LiveKit transport
        working-directory: waddle-core
        run: cargo test -p waddle-media --features livekit --locked

      - name: Lint the fully connected runtime
        working-directory: waddle-core
        run: cargo clippy -p waddle-runtime --features grpc,livekit --all-targets --locked -- -D warnings
