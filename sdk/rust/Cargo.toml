[package]
name = "waddle-sdk-shim"
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
description = "PyO3 shim binding waddle-runtime for the waddle Python package"
publish = false

# Deliberately its own workspace root (empty table): joining the waddle-core
# workspace would drag pyo3's extension-module linkage into core CI. Path
# deps below always build the working-tree core, so there is no version skew.
[workspace]

[lib]
crate-type = ["cdylib"]

# Connected builds. NO default features: the featureless shim is the baseline
# plain `cargo clippy`/`check` build, and it must stay tokio- and
# libwebrtc-free — that is what keeps the transports genuinely optional in the
# core beneath it. No distribution ships featureless: `sdk/pyproject.toml`
# builds `grpc`, `sdk/media/pyproject.toml` builds `grpc,livekit`. Each
# feature only turns on the corresponding core transport — the shim itself
# grows kwargs, never logic.
# `waddle-runtime/{grpc,livekit}` are the same leaf features by another name;
# naming both keeps the intent readable if runtime's own wiring ever grows.
[features]
grpc = [
    "dep:waddle-controlplane",
    "waddle-controlplane/tonic-transport",
    "waddle-runtime/grpc",
]
livekit = ["waddle-media/livekit", "waddle-runtime/livekit"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
parking_lot = "0.12"
bytes = "1"
waddle-runtime = { path = "../../waddle-core/crates/waddle-runtime" }
waddle-types = { path = "../../waddle-core/crates/waddle-types" }
waddle-gate = { path = "../../waddle-core/crates/waddle-gate" }
waddle-sidecar = { path = "../../waddle-core/crates/waddle-sidecar" }
waddle-media = { path = "../../waddle-core/crates/waddle-media" }
# Only the `grpc` feature needs this directly: waddle-runtime takes an
# `Arc<dyn ControlTransport>` and deliberately does not re-export the tonic
# constructor, so `grpc::connect(GrpcConfig)` is reached from here.
waddle-controlplane = { path = "../../waddle-core/crates/waddle-controlplane", optional = true }
