[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "waddle-sdk"
description = "Python frontend for Waddle: supervision for real-world robot policy rollouts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[dependency-groups]
# mcap: the e2e test reads /waddle/actions back from the episode MCAP.
dev = ["pytest>=8", "mcap>=1.1", "maturin>=1.14,<2"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "python"
module-name = "waddle._core"
# Keep extension-module OUT of Cargo.toml so plain cargo clippy/check work.
features = ["pyo3/extension-module"]
