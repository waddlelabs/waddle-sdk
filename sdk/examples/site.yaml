api_version: waddle.site/v1
kind: Site
metadata:
  id: simulated-yam
parts:
  arm:
    driver: waddle_sdk.robots.yam:arm
    posture: supervised
    connection: {}
    joint_limits: {}
    gripper:
      joint: gripper
      closed_m: 0.0
      open_m: 0.095
      closed_action: 0.0
      open_action: 1.0
    options:
      sim: true
      gripper_limits: [1.7, 0.1]
cameras: {}
frames: {}
calibration:
  artifacts: calib/
workspace_bounds:
  min: [-0.7, -0.7, 0.0]
  max: [0.7, 0.7, 1.0]
envelope:
  static_keepouts: []
  self_collision: {}
recording:
  root: recordings/
  format: mcap
