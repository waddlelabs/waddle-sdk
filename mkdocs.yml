site_name: Waddle SDK
site_description: Site-owned hardware, safety, timing, and recording for supervised robot policy rollouts
site_url: https://waddle-sdk.readthedocs.io/
repo_url: https://github.com/waddlelabs/waddle-sdk
repo_name: waddlelabs/waddle-sdk
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/index.md
      - Session and lease lifecycle: lease-lifecycle.md
  - Protocol and Rust core:
      - Contract hierarchy: core/contracts.md
      - Normative glossary: core/glossary.md
      - Normative FSM: core/fsm.md
      - Normative versioning rules: core/versioning.md
      - Architecture: core/architecture.md
      - Rust API reference: core/rust-reference.md
  - Python:
      - Python SDK: python/index.md
      - Site lifecycle and manifest: python/site.md
      - API reference: python/reference.md
  - Port custom hardware:
      - Porting contract: hardware-backends.md
      - Agent skills: porting/agent-skills.md
      - Robot adapters: porting/robot.md
      - Camera adapters: porting/camera.md
      - Validation and commissioning: porting/testing.md

exclude_docs: |
  RELEASING.md
  changelogs/
  READTHEDOCS.md
  requirements.in
  requirements.txt

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - sdk/python
          options:
            allow_inspection: false
            docstring_section_style: table
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: info
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn
